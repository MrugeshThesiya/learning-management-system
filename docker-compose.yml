services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    environment:
      DATABASE_URL: postgres://lms:lms@db:5432/lms
      JWT_SECRET: change-me
      PORT: "4000"
    # The DB is ephemeral (tmpfs), so seed demo data on every start (idempotent)
    command: sh -c "node src/wait-for-db.js && node src/seed.js && npm start"
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  client:
    build: { context: ., dockerfile: Dockerfile.client }
    environment:
      VITE_API_URL: http://localhost:4000
    ports: ["5173:5173"]
    depends_on: [server]
    restart: unless-stopped
