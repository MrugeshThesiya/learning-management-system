services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    environment:
      DATABASE_URL: postgres://lms:lms@db:5432/lms
      JWT_SECRET: change-me
      PORT: "4000"
    # The DB is ephemeral (tmpfs), so seed demo data on every start (idempotent)
    command: sh -c "node src/wait-for-db.js && node src/seed.js && npm start"
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  client:
    build: { context: ., dockerfile: Dockerfile.client }
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports: ["5173:5173"]
    depends_on: [server]
    restart: unless-stopped
  # --- Selenium e2e (opt-in via `docker compose --profile e2e up`) ---
  # The browser lives in `selenium`; the `e2e` runner drives it over Remote
  # WebDriver. In-network URLs are used so the grid browser can reach the app:
  # run with VITE_API_URL=http://server:4000 so the client page's API calls
  # resolve from inside the selenium container.
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports: ["4444:4444"]
    profiles: [e2e]
  e2e:
    build: { context: ., dockerfile: Dockerfile.e2e }
    environment:
      E2E_BASE_URL: http://client:5173
      E2E_API_URL: http://server:4000
      E2E_SELENIUM_URL: http://selenium:4444/wd/hub
    depends_on: [selenium, server, client]
    profiles: [e2e]
