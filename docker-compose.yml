version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    environment:
      DATABASE_URL: postgres://lms:lms@db:5432/lms
      JWT_SECRET: change-me
      PORT: "4000"
    ports: ["4000:4000"]
    depends_on: [db]
  client:
    build: { context: ., dockerfile: Dockerfile.client }
    ports: ["5173:5173"]
    depends_on: [server]
volumes:
  pgdata:
